<html lang="hu"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <title>Neon Fluid Physics Puzzle - Glass Simulation</title>

    <style>
        body {
            font-family: 'Fredoka', 'Inter', sans-serif;
            background: radial-gradient(circle at center, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: #ffffff;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        /* Cosmic background sparkling dust */
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.1; transform: scale(0.6); }
            50% { opacity: 0.9; transform: scale(1.4); box-shadow: 0 0 12px rgba(255, 255, 255, 0.9); }
        }

        /* Realistic Curved Glass Tube Container */
        .tube-container {
            position: relative;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            user-select: none;
            padding-top: 10px;
            filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.7));
        }

        .tube-container.selected {
            transform: translateY(-28px) scale(1.08) rotate(-4deg);
        }

        .tube-container.selected .tube-glass {
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.85), inset 0 0 25px rgba(255, 255, 255, 0.9);
            border-color: #d8b4fe;
        }

        /* Rolled Rim of the Glass Tube */
        .tube-rim {
            width: 34px;
            height: 8px;
            background: linear-gradient(90deg, rgba(255,255,255,0.4), rgba(255,255,255,0.9), rgba(255,255,255,0.4));
            border-radius: 4px;
            margin: 0 auto;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8), inset 0 1px 2px rgba(255,255,255,1);
            z-index: 20;
            position: relative;
        }

        /* Narrow Neck of the Tube */
        .tube-neck {
            width: 24px;
            height: 20px;
            border-left: 3.5px solid rgba(216, 180, 254, 0.6);
            border-right: 3.5px solid rgba(216, 180, 254, 0.6);
            margin: 0 auto;
            background: linear-gradient(90deg, 
                rgba(255, 255, 255, 0.05) 0%, 
                rgba(255, 255, 255, 0.3) 50%, 
                rgba(255, 255, 255, 0.05) 100%
            );
            position: relative;
            z-index: 15;
        }

        /* Ergonomic Shoulder Transition */
        .tube-shoulder {
            width: 70px;
            height: 18px;
            margin: 0 auto;
            position: relative;
            z-index: 15;
        }

        .tube-shoulder::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 18px;
            border-top: 3.5px solid rgba(216, 180, 254, 0.6);
            border-left: 3.5px solid rgba(216, 180, 254, 0.6);
            border-right: 3.5px solid rgba(216, 180, 254, 0.6);
            border-top-left-radius: 22px;
            border-top-right-radius: 22px;
            background: linear-gradient(90deg, 
                rgba(255, 255, 255, 0.08) 0%, 
                rgba(255, 255, 255, 0.25) 40%, 
                rgba(255, 255, 255, 0.04) 75%, 
                rgba(255, 255, 255, 0.15) 100%
            );
        }

        /* Main Cylindrical Glass Body */
        .tube-glass {
            width: 74px;
            height: 170px;
            border-left: 3.5px solid rgba(216, 180, 254, 0.55);
            border-right: 3.5px solid rgba(216, 180, 254, 0.55);
            border-bottom: 3.5px solid rgba(216, 180, 254, 0.6);
            border-bottom-left-radius: 32px;
            border-bottom-right-radius: 32px;
            background: linear-gradient(90deg, 
                rgba(255, 255, 255, 0.03) 0%, 
                rgba(255, 255, 255, 0.18) 25%, 
                rgba(255, 255, 255, 0.01) 70%, 
                rgba(255, 255, 255, 0.12) 100%
            );
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 16px rgba(255, 255, 255, 0.3), 0 15px 30px rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(3px);
            margin: 0 auto;
        }

        /* Specular Glass Highlights */
        .glass-shine {
            position: absolute;
            top: 8px;
            left: 7px;
            width: 6px;
            height: 150px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.75), rgba(255,255,255,0.02));
            border-radius: 3px;
            pointer-events: none;
            z-index: 25;
        }

        .glass-shine-secondary {
            position: absolute;
            top: 25px;
            right: 9px;
            width: 3px;
            height: 120px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.3), rgba(255,255,255,0.01));
            border-radius: 2px;
            pointer-events: none;
            z-index: 25;
        }

        /* Fluid Layer Styling with Meniscus & Glowing Neon Shader */
        .fluid-layer {
            position: absolute;
            left: 0;
            right: 0;
            height: 25%;
            transition: height 0.35s cubic-bezier(0.4, 0, 0.2, 1), bottom 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fluid-layer::after {
            content: '';
            position: absolute;
            top: -4px;
            left: 0;
            right: 0;
            height: 8px;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0.3) 60%, transparent 100%);
            border-radius: 50%;
        }

        /* Floating internal fluid bubbles */
        .fluid-bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            animation: bubbleRise 2s infinite ease-in;
            pointer-events: none;
        }

        @keyframes bubbleRise {
            0% { transform: translateY(0) scale(0.6); opacity: 0.2; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-35px) scale(1.2); opacity: 0; }
        }

        /* Sparkling glass particles */
        .sparkle-particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffffff, 0 0 20px #a855f7;
            animation: sparkleAnim 1.8s infinite alternate ease-in-out;
            pointer-events: none;
            z-index: 28;
        }

        @keyframes sparkleAnim {
            0% { transform: scale(0.3); opacity: 0.2; }
            100% { transform: scale(1.6); opacity: 1; }
        }

        /* UI Neon Buttons */
        .game-btn {
            background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
            border: 2px solid rgba(216, 180, 254, 0.5);
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.5), inset 0 2px 5px rgba(255,255,255,0.4);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .game-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.8), inset 0 2px 8px rgba(255,255,255,0.6);
        }
        .game-btn:active {
            transform: translateY(1px);
        }

        /* Overlay Fluid Pour Stream Canvas */
        #pour-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }
    </style>

d-layer" style="bottom: 25%; height: 25%; background: linear-gradient(135deg, rgb(249, 115, 22), rgb(194, 65, 12)); box-shadow: rgba(255, 255, 255, 0.5) 0px 3px 8px inset, rgba(249, 115, 22, 0.85) 0px 0px 16px;"><div class="fluid-bubble" style="width: 4.58204px; height: 4.58204px; left: 56.3769px; bottom: 11.8669%; animation-duration: 2.24646s; animation-delay: 0.813681s;"></div></div><div class="fluid-layer" style="bottom: 50%; height: 25%; background: linear-gradient(135deg, rgb(6, 182, 212), rgb(14, 116, 144)); box-shadow: rgba(255, 255, 255, 0.5) 0px 3px 8px inset, rgba(6, 182, 212, 0.85) 0px 0px 16px;"></div><div class="fluid-layer" style="bottom: 75%; height: 25%; background: linear-gradient(135deg, rgb(244, 63, 94), rgb(190, 18, 60)); box-shadow: rgba(255, 255, 255, 0.5) 0px 3px 8px inset, rgba(244, 63, 94, 0.85) 0px 0px 16px;"></div></div></div></div>

    <script>
        // Fluid Neon Color Palettes with glowing shaders
        const FLUID_COLORS = {
            crimson: { bg: 'linear-gradient(135deg, #f43f5e, #be123c)', glow: 'rgba(244, 63, 94, 0.85)', name: 'Karmazsin' },
            electric: { bg: 'linear-gradient(135deg, #06b6d4, #0e7490)', glow: 'rgba(6, 182, 212, 0.85)', name: 'Elektromos' },
            neonlime: { bg: 'linear-gradient(135deg, #22c55e, #15803d)', glow: 'rgba(34, 197, 94, 0.85)', name: 'Neon Zöld' },
            sundown: { bg: 'linear-gradient(135deg, #f97316, #c2410c)', glow: 'rgba(249, 115, 22, 0.85)', name: 'Naplemente' },
            amethyst: { bg: 'linear-gradient(135deg, #a855f7, #7e22ce)', glow: 'rgba(168, 85, 247, 0.85)', name: 'Ametiszt' },
            goldburst: { bg: 'linear-gradient(135deg, #eab308, #a16207)', glow: 'rgba(234, 179, 8, 0.85)', name: 'Arany' },
            hotpink: { bg: 'linear-gradient(135deg, #ec4899, #be185d)', glow: 'rgba(236, 72, 153, 0.85)', name: 'Pink' }
        };

        const CAPACITY = 4; // 4 fluid segments per tube
        let currentLevel = 1;
        let coins = 1850;
        let audioEnabled = true;
        let tubes = [];
        let historyStates = [];
        let selectedTubeIdx = null;
        let isPouring = false;

        // Web Audio API Synthesizer for immersive fluid sounds
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!audioEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'select') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.start(now);
                osc.stop(now + 0.12);
            } else if (type === 'pour') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.linearRampToValueAtTime(550, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'victory') {
                osc.type = 'sine';
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.frequency.setValueAtTime(freq, now + i * 0.12);
                    g.gain.setValueAtTime(0.2, now + i * 0.12);
                    g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.3);
                    o.start(now + i * 0.12);
                    o.stop(now + i * 0.12 + 0.3);
                });
            }
        }

        function toggleAudio() {
            audioEnabled = !audioEnabled;
            document.getElementById('audio-btn').innerText = audioEnabled ? '🔊' : '🔇';
            showToast(audioEnabled ? 'Hangok bekapcsolva 🎵' : 'Hangok elnémítva 🔇', '⚙️');
        }

        // Initialize cosmic twinkling background stars
        function initStars() {
            const container = document.getElementById('stars-container');
            const count = 55;
            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 3 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.setProperty('--duration', `${Math.random() * 3 + 1.5}s`);
                star.style.animationDelay = `${Math.random() * 3}s`;
                container.appendChild(star);
            }
        }

        // Levels configuration
        const LEVELS_DATA = {
            1: [
                ['crimson', 'electric', 'neonlime', 'crimson'],
                ['neonlime', 'amethyst', 'electric', 'sundown'],
                ['sundown', 'crimson', 'amethyst', 'neonlime'],
                ['amethyst', 'sundown', 'electric', 'crimson'],
                [],
                [],
                []
            ],
            2: [
                ['goldburst', 'hotpink', 'electric', 'goldburst'],
                ['amethyst', 'hotpink', 'sundown', 'electric'],
                ['sundown', 'goldburst', 'amethyst', 'hotpink'],
                ['electric', 'sundown', 'hotpink', 'goldburst'],
                ['amethyst', 'electric', 'amethyst', 'sundown'],
                [],
                []
            ],
            3: [
                ['neonlime', 'crimson', 'goldburst', 'amethyst'],
                ['amethyst', 'electric', 'neonlime', 'sundown'],
                ['sundown', 'crimson', 'electric', 'goldburst'],
                ['goldburst', 'neonlime', 'amethyst', 'crimson'],
                ['electric', 'sundown', 'crimson', 'neonlime'],
                [],
                []
            ]
        };

        function loadLevel(lvl) {
            if (lvl > 3) lvl = 1;
            if (lvl < 1) lvl = 3;
            currentLevel = lvl;
            document.getElementById('level-display').innerText = `Level ${lvl}`;
            selectedTubeIdx = null;
            historyStates = [];

            // Clone level layout
            tubes = JSON.parse(JSON.stringify(LEVELS_DATA[lvl] || LEVELS_DATA[1]));
            renderBoard();
        }

        function nextLevel() {
            document.getElementById('victory-modal').classList.add('hidden');
            coins += 150;
            document.getElementById('coin-count').innerText = coins;
            loadLevel(currentLevel + 1);
            showToast(`Gratulálunk! Level ${currentLevel} betöltve!`, '🚀');
        }

        function prevLevel() {
            loadLevel(currentLevel - 1);
        }

        function restartLevel() {
            loadLevel(currentLevel);
            showToast('Szint újrakezdve!', '🔄');
        }

        // Render Tubes and Fluid layers onto the DOM
        function renderBoard() {
            const topRowEl = document.getElementById('top-row');
            const bottomRowEl = document.getElementById('bottom-row');
            topRowEl.innerHTML = '';
            bottomRowEl.innerHTML = '';

            const splitIdx = Math.ceil(tubes.length / 2);

            tubes.forEach((tube, idx) => {
                const isSelected = selectedTubeIdx === idx;
                
                const container = document.createElement('div');
                container.className = `tube-container flex flex-col items-center ${isSelected ? 'selected' : ''}`;
                container.onclick = () => selectTube(idx);

                // 1. Rolled Rim
                const rim = document.createElement('div');
                rim.className = 'tube-rim';

                // 2. Neck
                const neck = document.createElement('div');
                neck.className = 'tube-neck';

                // 3. Shoulder
                const shoulder = document.createElement('div');
                shoulder.className = 'tube-shoulder';

                // 4. Glass Cylinder Body
                const glass = document.createElement('div');
                glass.className = 'tube-glass';

                // Specular highlights
                const shine = document.createElement('div');
                shine.className = 'glass-shine';
                glass.appendChild(shine);

                const shineSec = document.createElement('div');
                shineSec.className = 'glass-shine-secondary';
                glass.appendChild(shineSec);

                // Magical glass sparkle dust
                for (let s = 0; s < 2; s++) {
                    const sparkle = document.createElement('div');
                    sparkle.className = 'sparkle-particle';
                    sparkle.style.top = `${30 + Math.random() * 110}px`;
                    sparkle.style.left = `${12 + Math.random() * 46}px`;
                    sparkle.style.animationDelay = `${Math.random() * 1.6}s`;
                    glass.appendChild(sparkle);
                }

                // Render Fluid Layers from bottom to top
                for (let l = 0; l < CAPACITY; l++) {
                    const colorKey = tube[l];
                    if (colorKey) {
                        const layer = document.createElement('div');
                        layer.className = 'fluid-layer';
                        layer.style.bottom = `${l * 25}%`;
                        layer.style.height = '25%';

                        const colorObj = FLUID_COLORS[colorKey] || { bg: '#888', glow: 'rgba(255,255,255,0.5)' };
                        layer.style.background = colorObj.bg;
                        layer.style.boxShadow = `inset 0 3px 8px rgba(255,255,255,0.5), 0 0 16px ${colorObj.glow}`;

                        // Internal rising fluid bubbles
                        if (Math.random() > 0.4) {
                            const bubble = document.createElement('div');
                            bubble.className = 'fluid-bubble';
                            bubble.style.width = `${3 + Math.random() * 4}px`;
                            bubble.style.height = bubble.style.width;
                            bubble.style.left = `${15 + Math.random() * 44}px`;
                            bubble.style.bottom = `${5 + Math.random() * 15}%`;
                            bubble.style.animationDuration = `${1.2 + Math.random() * 1.5}s`;
                            bubble.style.animationDelay = `${Math.random() * 1}s`;
                            layer.appendChild(bubble);
                        }

                        glass.appendChild(layer);
                    }
                }

                container.appendChild(rim);
                container.appendChild(neck);
                container.appendChild(shoulder);
                container.appendChild(glass);

                if (idx < splitIdx) {
                    topRowEl.appendChild(container);
                } else {
                    bottomRowEl.appendChild(container);
                }
            });
        }

        function selectTube(idx) {
            if (isPouring) return;

            if (selectedTubeIdx === null) {
                if (tubes[idx].length === 0) {
                    showToast('Üres üveget nem választhatsz ki!', '⚠️');
                    return;
                }
                selectedTubeIdx = idx;
                playSound('select');
                renderBoard();
            } else if (selectedTubeIdx === idx) {
                selectedTubeIdx = null;
                renderBoard();
            } else {
                const fromIdx = selectedTubeIdx;
                const toIdx = idx;
                selectedTubeIdx = null;
                renderBoard();

                attemptPourAnimation(fromIdx, toIdx);
            }
        }

        // Fluid Pour Physics Simulation using Canvas Stream & Splatters
        function attemptPourAnimation(fromIdx, toIdx) {
            const fromTube = tubes[fromIdx];
            const toTube = tubes[toIdx];

            if (fromTube.length === 0) return;

            const topColor = fromTube[fromTube.length - 1];

            if (toTube.length >= CAPACITY) {
                showToast('Ez az üveg teljesen tele van!', '🚫');
                return;
            }

            const destTopColor = toTube.length > 0 ? toTube[toTube.length - 1] : null;
            if (destTopColor && destTopColor !== topColor) {
                showToast('Csak azonos színű folyadékot önthetsz rá!', '🎨');
                return;
            }

            // Save state for undo
            historyStates.push(JSON.parse(JSON.stringify(tubes)));

            // Calculate pour count
            let pourCount = 0;
            for (let i = fromTube.length - 1; i >= 0; i--) {
                if (fromTube[i] === topColor) pourCount++;
                else break;
            }
            let space = CAPACITY - toTube.length;
            let actualPour = Math.min(pourCount, space);

            isPouring = true;
            playSound('pour');

            // Draw fluid stream on overlay canvas
            triggerPourCanvasEffect(fromIdx, toIdx, topColor, () => {
                for (let i = 0; i < actualPour; i++) {
                    fromTube.pop();
                    toTube.push(topColor);
                }
                isPouring = false;
                renderBoard();
                checkVictory();
            });
        }

        function triggerPourCanvasEffect(fromIdx, toIdx, colorKey, callback) {
            const canvas = document.getElementById('pour-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const fromEl = document.querySelectorAll('.tube-container')[fromIdx];
            const toEl = document.querySelectorAll('.tube-container')[toIdx];

            if (!fromEl || !toEl) {
                callback();
                return;
            }

            const r1 = fromEl.getBoundingClientRect();
            const r2 = toEl.getBoundingClientRect();

            const startX = r1.left + r1.width / 2;
            const startY = r1.top + 20;
            const endX = r2.left + r2.width / 2;
            const endY = r2.top + 20;

            const colorObj = FLUID_COLORS[colorKey] || { glow: '#a855f7' };

            let progress = 0;
            function animateStream() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                progress += 0.08;

                // Draw curved neon fluid stream
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                let cpX = (startX + endX) / 2;
                let cpY = Math.min(startY, endY) - 50;
                ctx.quadraticCurveTo(cpX, cpY, endX + (progress * 10), endY);

                ctx.strokeStyle = colorObj.glow;
                ctx.lineWidth = 10 * Math.sin(progress * Math.PI);
                ctx.lineCap = 'round';
                ctx.shadowColor = colorObj.glow;
                ctx.shadowBlur = 20;
                ctx.stroke();

                // Draw splash droplets at destination
                if (progress < 1) {
                    for (let i = 0; i < 4; i++) {
                        ctx.beginPath();
                        ctx.arc(
                            endX + (Math.random() - 0.5) * 30,
                            endY + (Math.random() - 0.5) * 15,
                            Math.random() * 4 + 2,
                            0,
                            Math.PI * 2
                        );
                        ctx.fillStyle = '#ffffff';
                        ctx.shadowBlur = 10;
                        ctx.fill();
                    }
                    requestAnimationFrame(animateStream);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    callback();
                }
            }
            animateStream();
        }

        function checkVictory() {
            let won = true;
            for (let tube of tubes) {
                if (tube.length === 0) continue;
                if (tube.length < CAPACITY) {
                    won = false;
                    break;
                }
                const first = tube[0];
                for (let c of tube) {
                    if (c !== first) {
                        won = false;
                        break;
                    }
                }
                if (!won) break;
            }

            if (won) {
                playSound('victory');
                document.getElementById('victory-modal').classList.remove('hidden');
            }
        }

        function undoMove() {
            if (historyStates.length === 0) {
                showToast('Nincs több visszavonható lépés!', '↩️');
                return;
            }
            tubes = historyStates.pop();
            selectedTubeIdx = null;
            renderBoard();
            showToast('Lépés visszavonva!', '🔄');
        }

        function addExtraTube() {
            if (coins < 50) {
                showToast('Nincs elég érméd extra üveghez (50 🪙)', '🪙');
                return;
            }
            coins -= 50;
            document.getElementById('coin-count').innerText = coins;
            tubes.push([]);
            renderBoard();
            showToast('Extra üveg hozzáadva a laboratóriumhoz! 🧪+', '🎉');
        }

        function showToast(text, icon = '💡') {
            const popup = document.getElementById('msg-popup');
            document.getElementById('msg-text').innerText = text;
            document.getElementById('msg-icon').innerText = icon;
            popup.style.opacity = '1';
            popup.style.transform = 'translate(-50%, 15px)';
            
            setTimeout(() => {
                popup.style.opacity = '0';
                popup.style.transform = 'translate(-50%, -20px)';
            }, 2500);
        }

        window.onload = function() {
            initStars();
            loadLevel(1);
        };
    </script>

</body></html>
