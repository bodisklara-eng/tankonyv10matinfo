<html lang="hu"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C++ Mátrix Feltöltés Szimuláció</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --text-color: #f8fafc;
            
            /* Értékek színei */
            --val-0-bg: #1e3a8a; /* Kék - Főátló (0) */
            --val-0-text: #93c5fd;
            --val-2-bg: #854d0e; /* Sárga/Borostyán - Mellékátló (2) */
            --val-2-text: #fef08a;
            --val-3-bg: #374151; /* Szürke - Egyéb mezők (3) */
            --val-3-text: #e5e7eb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 5px;
        }

        p.subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        .main-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            flex: 1;
            min-width: 320px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        /* Vezérlő gombok */
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }

        button {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 10px 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover { background-color: #0369a1; }
        button:disabled { background-color: #475569; cursor: not-allowed; }

        /* Mátrix stílusok */
        .matrix-grid {
            display: grid;
            gap: 8px;
            margin-top: 15px;
            justify-content: center;
        }

        .cell {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 6px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            transition: transform 0.2s, background-color 0.3s;
        }

        /* Színosztályok az értékekhez */
        .cell-0 { background-color: var(--val-0-bg); color: var(--val-0-text); border-color: #3b82f6; }
        .cell-2 { background-color: var(--val-2-bg); color: var(--val-2-text); border-color: #eab308; }
        .cell-3 { background-color: var(--val-3-bg); color: var(--val-3-text); }

        /* Villogó animáció aktív cellára */
        @keyframes pulse-glow {
            0% { transform: scale(1); box-shadow: 0 0 0px #ef4444; border-color: #ef4444; }
            50% { transform: scale(1.15); box-shadow: 0 0 15px #ef4444; border-color: #f87171; background-color: #991b1b; }
            100% { transform: scale(1); box-shadow: 0 0 0px #ef4444; }
        }

        .blinking {
            animation: pulse-glow 0.6s infinite alternate;
            z-index: 10;
        }

        /* Jelmagyarázat */
        .legend {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            justify-content: center;
            font-size: 0.85rem;
        }

        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-box { width: 16px; height: 16px; border-radius: 3px; }

        /* Változó kijelző */
        .state-tracker {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .state-card {
            background-color: #0f172a;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .state-card .label { font-size: 0.75rem; color: #94a3b8; }
        .state-card .val { font-size: 1.2rem; font-weight: bold; color: #f59e0b; }

        /* Konzol / Log */
        .console {
            background-color: #000;
            color: #4ade80;
            font-family: 'Consolas', monospace;
            padding: 12px;
            border-radius: 6px;
            min-height: 80px;
            font-size: 0.9rem;
            line-height: 1.4;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

<h1>C++ Mátrix Szimuláció</h1>
<p class="subtitle">Soronkénti elembeli bejárás és vizuális feltöltés</p>

<div class="main-container">
    <!-- BAL PANEL: Vezérlés és Kijelzés -->
    <div class="panel">
        <div class="controls">
            <button id="startBtn" onclick="toggleAutoRun()" disabled="" style="background-color: rgb(2, 132, 199);">Automata Lejátszás ▶</button>
            <button id="stepBtn" onclick="manualStep()" disabled="">Következő Lépés ➔</button>
            <button onclick="resetSim()" style="background-color: #475569;">Újra</button>
        </div>

        <div class="state-tracker">
            <div class="state-card"><div class="label">i (sor)</div><div id="varI" class="val">4</div></div>
            <div class="state-card"><div class="label">j (oszlop)</div><div id="varJ" class="val">4</div></div>
            <div class="state-card"><div class="label">a[i][j] értéke</div><div id="varVal" class="val">0</div></div>
        </div>

        <div class="console" id="logBox">&gt; A mátrix feltöltése és kiíratása sikeresen befejeződött!</div>

        <div class="legend">
            <div class="legend-item"><div class="legend-box cell-0"></div> Érték: 0 (i == j)</div>
            <div class="legend-item"><div class="legend-box cell-2"></div> Érték: 2 (j == n-i+1)</div>
            <div class="legend-item"><div class="legend-box cell-3"></div> Érték: 3 (egyéb)</div>
        </div>
    </div>

    <!-- JOBB PANEL: A Mátrix Vizualizációja -->
    <div class="panel" style="display: flex; flex-direction: column; align-items: center;">
        <h3 style="margin-top:0; color: #94a3b8;">Mátrix (n = 4)</h3>
        <div id="matrixGrid" class="matrix-grid" style="grid-template-columns: repeat(4, 50px);"><div id="cell-1-1" class="cell cell-0">0</div><div id="cell-1-2" class="cell cell-3">3</div><div id="cell-1-3" class="cell cell-3">3</div><div id="cell-1-4" class="cell cell-2">2</div><div id="cell-2-1" class="cell cell-3">3</div><div id="cell-2-2" class="cell cell-0">0</div><div id="cell-2-3" class="cell cell-2">2</div><div id="cell-2-4" class="cell cell-3">3</div><div id="cell-3-1" class="cell cell-3">3</div><div id="cell-3-2" class="cell cell-2">2</div><div id="cell-3-3" class="cell cell-0">0</div><div id="cell-3-4" class="cell cell-3">3</div><div id="cell-4-1" class="cell cell-2">2</div><div id="cell-4-2" class="cell cell-3">3</div><div id="cell-4-3" class="cell cell-3">3</div><div id="cell-4-4" class="cell cell-0 blinking">0</div></div>
    </div>
</div>

<script>
    const n = 4; // Mátrix mérete (4x4-es példa a jobb láthatóságért)
    let i = 1, j = 1;
    let timer = null;
    let isRunning = false;

    // Grid inicializálása
    function initGrid() {
        const grid = document.getElementById('matrixGrid');
        grid.style.gridTemplateColumns = `repeat(${n}, 50px)`;
        grid.innerHTML = '';

        for (let r = 1; r <= n; r++) {
            for (let c = 1; c <= n; c++) {
                const cell = document.createElement('div');
                cell.id = `cell-${r}-${c}`;
                cell.className = 'cell';
                cell.innerText = '?';
                grid.appendChild(cell);
            }
        }
    }

    function log(message) {
        document.getElementById('logBox').innerText = `> ${message}`;
    }

    function processStep() {
        if (i > n) {
            log("A mátrix feltöltése és kiíratása sikeresen befejeződött!");
            stopAutoRun();
            document.getElementById('stepBtn').disabled = true;
            document.getElementById('startBtn').disabled = true;
            return;
        }

        // Előző villogó elem eltávolítása
        document.querySelectorAll('.cell').forEach(c => c.classList.remove('blinking'));

        const currentCell = document.getElementById(`cell-${i}-${cVal(j)}`);
        
        // Aktuális elem villogtatása
        currentCell.classList.add('blinking');

        document.getElementById('varI').innerText = i;
        document.getElementById('varJ').innerText = j;

        let val = 0;
        let condText = "";

        // A C++ kód logikája
        if (i === j) {
            val = 0;
            condText = "Főátló (i == j)";
        } else if (j === (n - i + 1)) {
            val = 2;
            condText = "Mellékátló (j == n - i + 1)";
        } else {
            val = 3;
            condText = "Egyéb mező";
        }

        // Érték beállítása késleltetve a villogás hatásért
        setTimeout(() => {
            currentCell.innerText = val;
            currentCell.className = `cell cell-${val} blinking`;
            document.getElementById('varVal').innerText = val;
            log(`a[${i}][${j}] számítása: ${condText} -> Érték: ${val}`);
        }, 150);

        // Indexek léptetése
        j++;
        if (j > n) {
            j = 1;
            i++;
        }
    }

    function cVal(val) { return val; }

    function manualStep() {
        if (isRunning) stopAutoRun();
        processStep();
    }

    function toggleAutoRun() {
        if (isRunning) {
            stopAutoRun();
        } else {
            isRunning = true;
            document.getElementById('startBtn').innerText = "Szünet ❚❚";
            document.getElementById('startBtn').style.backgroundColor = "#d97706";
            timer = setInterval(processStep, 700); // 700ms-enként lép
        }
    }

    function stopAutoRun() {
        isRunning = false;
        clearInterval(timer);
        document.getElementById('startBtn').innerText = "Automata Lejátszás ▶";
        document.getElementById('startBtn').style.backgroundColor = "#0284c7";
    }

    function resetSim() {
        stopAutoRun();
        i = 1;
        j = 1;
        document.getElementById('stepBtn').disabled = false;
        document.getElementById('startBtn').disabled = false;
        document.getElementById('varI').innerText = '-';
        document.getElementById('varJ').innerText = '-';
        document.getElementById('varVal').innerText = '-';
        log("Szimuláció újraindítva.");
        initGrid();
    }

    // Indításkor grid kirajzolása
    initGrid();
</script>


</body></html>
