<html lang="hu"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Premium Cyberpunk Matrix Lab v3.0</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #070b19 0%, #0f172a 100%);
            --panel-bg: rgba(30, 41, 59, 0.45);
            --neon-blue: #00f0ff;
            --neon-purple: #bd00ff;
            --neon-green: #39ff14;
            --neon-pink: #ff0055;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --border-glow: rgba(0, 240, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 0);
            background-size: 24px 24px;
            z-index: -1;
        }

        .dashboard {
            width: 100%;
            max-width: 1000px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 45px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7),
                        0 0 40px rgba(0, 240, 255, 0.05);
            border: 1px solid var(--glass-border);
            animation: fadeIn 0.8s ease-out;
        }

        h1 {
            margin-top: 0;
            font-size: 2.8rem;
            font-weight: 900;
            text-align: center;
            letter-spacing: -1.5px;
            margin-bottom: 5px;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(189, 0, 255, 0.2);
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .control-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 25px;
            background: rgba(15, 23, 42, 0.6);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(0, 240, 255, 0.1);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
            margin-bottom: 40px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            font-size: 0.8rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 800;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        input[type="range"] {
            flex: 1;
            accent-color: var(--neon-blue);
            cursor: pointer;
        }

        .badge-value {
            background: rgba(0, 240, 255, 0.1);
            color: var(--neon-blue);
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 700;
            border: 1px solid rgba(0, 240, 255, 0.3);
            min-width: 20px;
            text-align: center;
        }

        .btn-action {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, var(--neon-purple) 0%, #7e22ce 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(189, 0, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(189, 0, 255, 0.5), 0 0 15px var(--neon-purple);
            filter: brightness(1.1);
        }

        .matrix-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
        }

        .matrix-container-box {
            background: rgba(10, 15, 30, 0.7);
            padding: 35px;
            border-radius: 24px;
            border: 1px solid var(--border-glow);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.05);
            max-width: 100%;
            overflow-x: auto;
        }

        .matrix-grid {
            display: grid;
            gap: 14px;
            justify-content: center;
        }

        .matrix-cell {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: var(--text-main);
            text-align: center;
            font-size: 1.3rem;
            font-weight: 800;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.05);
        }

        .matrix-cell:hover {
            border-color: rgba(0, 240, 255, 0.5);
            background: rgba(0, 240, 255, 0.05);
        }

        .matrix-cell:focus {
            outline: none;
            border-color: var(--neon-blue);
            transform: scale(1.12);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.4), inset 0 0 10px rgba(0, 240, 255, 0.2);
            background: rgba(15, 23, 42, 0.9);
        }

        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button {
            -webkit-appearance: none; margin: 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .stat-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.04);
        }

        .stat-card.blue::before { background: var(--neon-blue); box-shadow: 0 2px 10px var(--neon-blue); }
        .stat-card.purple::before { background: var(--neon-purple); box-shadow: 0 2px 10px var(--neon-purple); }
        .stat-card.green::before { background: var(--neon-green); box-shadow: 0 2px 10px var(--neon-green); }

        .stat-value {
            font-size: 2.2rem;
            font-weight: 900;
            margin-top: 10px;
            font-variant-numeric: tabular-nums;
        }

        .blue .stat-value { color: var(--neon-blue); text-shadow: 0 0 15px rgba(0, 240, 255, 0.3); }
        .purple .stat-value { color: var(--neon-purple); text-shadow: 0 0 15px rgba(189, 0, 255, 0.3); }
        .green .stat-value { color: var(--neon-green); text-shadow: 0 0 15px rgba(57, 255, 20, 0.3); }

        .panel-code {
            background: #05070f;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 25px;
            position: relative;
            margin-top: 20px;
        }

        .panel-code::after {
            content: 'LIVE RENDER';
            position: absolute; top: 12px; right: 15px;
            font-size: 0.65rem; color: var(--text-muted);
            letter-spacing: 1px; font-weight: 900;
        }

        .code-title {
            font-size: 0.85rem;
            font-weight: 800;
            color: #94a3b8;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        pre {
            margin: 0;
            font-family: 'Consolas', 'Fira Code', Monaco, monospace;
            font-size: 0.95rem;
            line-height: 1.5;
            color: #e2e8f0;
            white-space: pre-wrap;
        }

        .keyword { color: #ff79c6; }
        .type { color: #8be9fd; }
        .number { color: #bd93f9; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="dashboard">
    <h1>MATRIX LAB PRO</h1>
    <div class="subtitle">Interactive Multiverse Engine v3.0</div>
    
    <div class="control-panel">
        <div class="input-group">
            <label>Sorok száma</label>
            <div class="slider-container">
                <input type="range" id="sorok" min="1" max="6" value="3" oninput="updateSliders(); generateMatrix();">
                <span id="badgeSorok" class="badge-value">3</span>
            </div>
        </div>
        <div class="input-group">
            <label>Oszlopok száma</label>
            <div class="slider-container">
                <input type="range" id="oszlopok" min="1" max="6" value="3" oninput="updateSliders(); generateMatrix();">
                <span id="badgeOszlopok" class="badge-value">3</span>
            </div>
        </div>
        <button class="btn-action" onclick="randomizeValues()">⚡ Értékek Randomizálása</button>
    </div>

    <div class="matrix-section">
        <div class="matrix-container-box">
            <div id="matrixContainer" class="matrix-grid" style="grid-template-columns: repeat(3, max-content);"><input type="number" class="matrix-cell" id="c-0-0"><input type="number" class="matrix-cell" id="c-0-1"><input type="number" class="matrix-cell" id="c-0-2"><input type="number" class="matrix-cell" id="c-1-0"><input type="number" class="matrix-cell" id="c-1-1"><input type="number" class="matrix-cell" id="c-1-2"><input type="number" class="matrix-cell" id="c-2-0"><input type="number" class="matrix-cell" id="c-2-1"><input type="number" class="matrix-cell" id="c-2-2"></div>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card blue">
            <label>Összeg</label>
            <div id="statSum" class="stat-value">107</div>
        </div>
        <div class="stat-card purple">
            <label>Maximum</label>
            <div id="statMax" class="stat-value">20</div>
        </div>
        <div class="stat-card green">
            <label>Átlag</label>
            <div id="statAvg" class="stat-value">11.9</div>
        </div>
    </div>

    <div class="panel-code">
        <div class="code-title">C++ kód generálása</div>
        <pre id="cppOutput"><span class="keyword">int</span> a[<span class="number">3</span>][<span class="number">3</span>] = {
    { <span class="number">20</span>, <span class="number">16</span>, <span class="number">8</span> },
    { <span class="number">9</span>, <span class="number">19</span>, <span class="number">5</span> },
    { <span class="number">6</span>, <span class="number">15</span>, <span class="number">9</span> }
};</pre>
    </div>
</div>

<script>
    window.onload = function() {
        updateSliders();
        generateMatrix();
    };

    function updateSliders() {
        document.getElementById('badgeSorok').textContent = document.getElementById('sorok').value;
        document.getElementById('badgeOszlopok').textContent = document.getElementById('oszlopok').value;
    }

    function generateMatrix() {
        const rows = parseInt(document.getElementById('sorok').value);
        const cols = parseInt(document.getElementById('oszlopok').value);
        const container = document.getElementById('matrixContainer');
        
        container.innerHTML = '';
        container.style.gridTemplateColumns = `repeat(${cols}, max-content)`;

        for (let i = 0; i < rows; i++) {
            for (let j = 0; j < cols; j++) {
                const cell = document.createElement('input');
                cell.type = 'number';
                cell.className = 'matrix-cell';
                cell.id = `c-${i}-${j}`;
                cell.value = Math.floor(Math.random() * 20) + 1;
                cell.addEventListener('input', runCalculations);
                container.appendChild(cell);
            }
        }
        runCalculations();
    }

    function randomizeValues() {
        const rows = parseInt(document.getElementById('sorok').value);
        const cols = parseInt(document.getElementById('oszlopok').value);
        
        for (let i = 0; i < rows; i++) {
            for (let j = 0; j < cols; j++) {
                const cell = document.getElementById(`c-${i}-${j}`);
                if (cell) {
                    cell.value = Math.floor(Math.random() * 99) + 1;
                }
            }
        }
        runCalculations();
    }

    function runCalculations() {
        const rows = parseInt(document.getElementById('sorok').value);
        const cols = parseInt(document.getElementById('oszlopok').value);
        
        let sum = 0;
        let max = -Infinity;
        let totalCells = rows * cols;
        let matrixData = [];

        for (let i = 0; i < rows; i++) {
            let rowData = [];
            for (let j = 0; j < cols; j++) {
                const cell = document.getElementById(`c-${i}-${j}`);
                const val = cell ? parseInt(cell.value) || 0 : 0;
                
                sum += val;
                if (val > max) max = val;
                rowData.push(val);
            }
            matrixData.push(rowData);
        }

        document.getElementById('statSum').textContent = sum;
        document.getElementById('statMax').textContent = max === -Infinity ? 0 : max;
        document.getElementById('statAvg').textContent = (sum / totalCells).toFixed(1);

        let cppCode = `<span class="keyword">int</span> a[<span class="number">${rows}</span>][<span class="number">${cols}</span>] = {\n`;
        for (let i = 0; i < rows; i++) {
            cppCode += "    { ";
            cppCode += matrixData[i].map(v => `<span class="number">${v}</span>`).join(', ');
            cppCode += " }" + (i < rows - 1 ? ",\n" : "\n");
        }
        cppCode += "};";
        document.getElementById('cppOutput').innerHTML = cppCode;
    }
</script>



</body></html>
